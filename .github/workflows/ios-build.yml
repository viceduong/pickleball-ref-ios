name: Build PickleRef IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build PickleRef (iOS 15)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Use default Xcode
        run: xcode-select -p && xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o /tmp/xcodegen.zip
          cd /tmp && unzip -q xcodegen.zip -d xcgen
          echo "/tmp/xcgen/xcodegen/bin" >> $GITHUB_PATH

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Build iOS App (device, unsigned)
        run: |
          cd ios
          xcodebuild \
            -project PickleRef.xcodeproj \
            -scheme PickleRef \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.pickleref.app

      - name: Package .ipa
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name 'PickleRef.app' -type d -path '*/Debug-iphoneos/*' | head -1)
          echo "App at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PickleRef.ipa Payload/
          ls -la PickleRef.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PickleRef-ipa
          path: PickleRef.ipa
          retention-days: 30
